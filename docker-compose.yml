version: '3.9'

services:
  mongodb:
    image: mongo:7.0-jammy
    container_name: smartleads_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: smart-leads
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    networks:
      - smartleads_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartleads_backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/smart-leads?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_change_this_in_production_min_32_chars}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: http://localhost
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - smartleads_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: smartleads_frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - smartleads_network

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  smartleads_network:
    driver: bridge
